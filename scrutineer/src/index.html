<!-- Scrutineer. The race runs continuously; the garage is somewhere you choose to go. -->
<div class="app race" id="app">
  <header class="top">
    <div class="mark">SCRUTINEER</div>
    <div class="tag">an agent that builds web interfaces, and rebuilds its own harness</div>
    <div class="views" role="tablist">
      <button class="view-tab on" id="tabTrack" role="tab">TRACK</button>
      <button class="view-tab dash-tab" id="tabDash" role="tab">TELEMETRY</button>
    </div>
    <div class="top-right">
      <button class="ghost-btn top-ghost" id="regsBtn">how this works</button>
      <button class="ghost-btn top-ghost" id="tryBtn">run it yourself</button>
      <span class="runcount" id="runCount"></span>
      <button class="hold" id="holdBtn" title="the loop runs on its own; this only pauses it">
        <span class="dot"></span>RUNNING</button>
    </div>
  </header>

  <main class="body">
    <section class="view">
      <div class="stage-box" id="viewTrack">
        <canvas id="stage" aria-label="The agent's harness"></canvas>
        <div class="hud" id="hud"></div>
        <div class="cards" id="cards"></div>
        <div class="overlay" id="overlay" hidden></div>

        <!-- The world feed. Every value in it is read from the loop's own bundle; the only
             invented numbers are the car's speed and gear, which are the car, not a result. -->
        <div class="rhud" id="raceHud">
          <div class="rh-tl">
            <div class="rh-tl-top">
              <span class="rh-live" id="rhLive">LIVE</span>
              <span class="rh-circuit" id="rhCircuit"></span>
            </div>
            <!-- The iteration, and what is actually different about the agent since run 1.
                 Deliberately quiet: there to be read, not to be announced. -->
            <div class="rh-since" id="rhSince" hidden></div>
          </div>

          <div class="rh-tr">
            <div class="rh-tower">
              <div class="rh-t-head"><b>SCRUTINEER</b><i id="rhRun">RUN 1 / 10</i></div>
              <div class="rh-row rh-lap"><span>LAP</span><b id="rhLap">0 / 20</b></div>
              <div class="rh-row"><span>BUILDING</span><b id="rhTask">&mdash;</b></div>
              <div class="rh-row"><span>CLEAN</span><b id="rhClean">0</b></div>
              <div class="rh-row rh-hero"><span>HELD-OUT</span><b id="rhScore">&mdash;</b><i id="rhDelta"></i></div>
              <div class="rh-row"><span>HARNESS</span><b id="rhHarness">L10</b></div>
              <div class="rh-row" id="rhBlameRow" hidden><span>BLAMED</span><b id="rhBlame"></b></div>
              <div class="rh-row rh-gap" id="rhGapRow" hidden><span>VS RUN 1</span><b id="rhGap"></b></div>
            </div>
            <div class="rh-phase" id="rhPhase">BUILDING</div>
          </div>

          <!-- The timing tower: who is being blamed in this run, and the championship
               across the season so far. -->
          <div class="rh-stand" id="rhStand" hidden></div>

          <!-- Sectors. Not invented: the loop measured the task families as two separate
               populations, and these are those sides. Purple is the best that sector has ever
               been this season, green is better than run 1, yellow is no better. -->
          <div class="rh-sectors" id="rhSectors"></div>

          <div class="rh-bl">
            <div class="rh-speed"><b id="rhSpeed">0</b><em>KM/H</em></div>
            <div class="rh-bar"><i id="rhSpeedBar"></i></div>
            <div class="rh-drive"><span class="rh-gear" id="rhGear">N</span><span class="rh-drs" id="rhDrs">DRS</span></div>
          </div>

          <div class="rh-br" id="rhGates" hidden></div>

          <!-- Laps, as the thing a lap actually is here: one interface, built and audited.
               The caption names the one in progress; every cell answers for itself on hover. -->
          <div class="rh-lapbar">
            <div class="rh-cap" id="rhCap"></div>
            <div class="rh-strip" id="rhStrip"></div>
          </div>
          <div class="rh-tip" id="rhTip" hidden></div>
          <div class="rh-fastest" id="rhFastest" hidden>
            <b>FASTEST LAP</b><i id="rhFastestVal"></i>
          </div>
        </div>
        <!-- The only thing that ever interrupts the race: the loop kept a change, and the
             garage is where you can go and look at it. Nothing moves until you press it. -->
        <div class="garage-call" id="garageCall" hidden>
          <span class="gc-eyebrow" id="gcEyebrow">UPGRADE FITTED</span>
          <span class="gc-what" id="gcWhat"></span>
          <button class="gc-go" id="gcGo">OPEN THE GARAGE</button>
        </div>
        <button class="track-back" id="trackBack" hidden>&larr; BACK TO THE TRACK</button>
      </div>
      <p class="say" id="say">Six components decide how this agent works.</p>
      <div class="meters" id="meters"></div>
    </section>

    <aside class="rig" aria-label="The harness">
      <div class="rig-head"><span>THE HARNESS</span><span class="rig-sub" id="rigSub">six components</span></div>
      <div class="rig-list" id="rig"></div>
    </aside>
  </main>

  <section class="work" id="work" aria-label="The agent's work"></section>
  <div class="regs" id="regs" hidden></div>
</div>
<!-- Live telemetry. Its own surface: takes the whole viewport, and shows the agent running
     rather than describing it. -->
<div class="dash" id="dash" hidden></div>
