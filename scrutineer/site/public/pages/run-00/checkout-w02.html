<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout form (2)</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#16181d;background:#fff}
main,header{max-width:780px;margin:0 auto;padding:24px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:19px;margin:22px 0 6px}
a{color:#0b4fa8}label{display:block;font-weight:600;margin:12px 0 4px}
input,select{font:inherit;padding:8px;border:1px solid #6c727f;border-radius:4px;width:100%;
  box-sizing:border-box;background:#fff;color:#16181d}
button{font:inherit;padding:9px 16px;border:0;border-radius:4px;background:#0b4fa8;color:#fff;
  cursor:pointer}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #b9bec9;padding:7px;
  text-align:left}th{background:#eef1f6}
ul{padding-left:20px}nav ul{display:flex;gap:16px;list-style:none;padding:0}
img{width:112px;height:78px;object-fit:cover;border-radius:4px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
[role=tab]{background:#eef1f6;color:#16181d;border:1px solid #b9bec9}
body{color:#9aa0a6;background:#c9ccd1}a{color:#8fa8c8}h1,h2{color:#a9aeb4}
</style></head>
<body><main><h1>Checkout form (2)</h1><form><label for="name">Full name</label><input id="name" type="text" name="name"><label for="email">Email</label><input id="email" type="email" name="email"><label for="card">Card number</label><input id="card" type="text" name="card"><label for="post">Postcode</label><input id="post" type="text" name="post"><label for="ctry">Country</label><select id="ctry" name="ctry"><option>United Kingdom</option><option>Ireland</option></select><button>Pay £48.00</button></form></main></body>
</html>
