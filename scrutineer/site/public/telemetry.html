<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrutineer telemetry</title>
<meta name="description" content="The season as instrument graphics: how a run works, whether it is getting faster, what it built, which part changed, and whether it holds up on a public benchmark.">
<meta name="theme-color" content="#07090B">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2306081A'/%3E%3Cpath d='M2 2h6v6H2zM8 8h6v6H8z' fill='%23F4C542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Scrutineer telemetry — the season as flat, vector instrument graphics. Deliberately not the
   broadcast: no pixels, no navy, no gold. Graphite, hairline vectors, glowing data, and one lime
   accent for whatever you have selected. One committed dark look, set explicitly. */
:root{
  --bg:#07090B; --bg-2:#0B0F12; --panel:rgba(13,18,22,.78); --panel-2:rgba(18,24,29,.92);
  --line:rgba(150,180,190,.13); --line-2:rgba(150,180,190,.26); --line-3:rgba(150,180,190,.42);
  --text:#E6EDF1; --mute:#7F8C95; --dim:#4E5A62;
  --lime:#D4FF3A; --mint:#34F5B0; --coral:#FF5A6E; --slate:#8A96A0; --amber:#FFB547; --violet:#A796FF; --ice:#CFEFFF;
  --ui:"Oxanium","Arial Narrow",system-ui,sans-serif;
  --num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--lime)}
:focus-visible{outline:1px solid var(--lime);outline-offset:2px}

/* the room: a dot grid, a vignette, and a slow scan */
.tx-bg{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 35%,rgba(52,245,176,.05),transparent 70%),
    radial-gradient(rgba(170,200,210,.07) 1px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.tx-bg::after{content:"";position:absolute;left:0;right:0;height:30vh;top:-30vh;
  background:linear-gradient(transparent,rgba(212,255,58,.025),transparent);animation:tx-scan 9s linear infinite}
@keyframes tx-scan{to{transform:translateY(160vh)}}

.tx{position:relative;height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr) 340px;grid-template-rows:62px minmax(0,1fr) auto;
  gap:14px 16px;padding:0 20px 18px}

/* a panel with HUD corner marks */
.hud{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hud::before{content:"";position:absolute;inset:-1px;pointer-events:none;--c:var(--line-3);
  background:
    linear-gradient(var(--c),var(--c)) top left/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) top left/1px 12px no-repeat,
    linear-gradient(var(--c),var(--c)) top right/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) top right/1px 12px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) bottom left/1px 12px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) bottom right/1px 12px no-repeat}

/* header */
.tx-top{grid-column:1/-1;display:flex;align-items:center;gap:16px}
.tx-mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.tx-glyph{width:18px;height:18px;border:1px solid var(--lime);transform:rotate(45deg);position:relative;box-shadow:0 0 12px rgba(212,255,58,.35)}
.tx-glyph::after{content:"";position:absolute;inset:4px;background:var(--lime)}
.tx-mark b{font:700 16px var(--ui);letter-spacing:.24em}
.tx-mark em{font:500 16px var(--ui);font-style:normal;letter-spacing:.24em;color:var(--lime)}
.tx-top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.tx-src{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tx-src i{width:7px;height:7px;border-radius:50%;background:var(--slate)}
.tx-src.live{color:var(--mint)}.tx-src.live i{background:var(--mint);box-shadow:0 0 10px var(--mint);animation:tx-blink 1.2s ease-in-out infinite}
.tx-link{font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--text);white-space:nowrap;
  padding:7px 12px;border:1px solid var(--line-2);border-radius:2px;background:var(--bg-2)}
.tx-link:hover{border-color:var(--lime);color:var(--lime)}
@keyframes tx-blink{50%{opacity:.3}}

/* the questions */
.tx-nav{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:8px;min-height:0}
.tx-nav button{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;padding:13px 14px 13px 18px;
  background:var(--panel);border:1px solid var(--line);border-radius:3px}
.tx-nav button b{font:600 15px/1.25 var(--ui);letter-spacing:.02em}
.tx-nav button em{font-style:normal;font-size:12px;color:var(--mute)}
.tx-nav button::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:transparent}
.tx-nav button:hover{border-color:var(--line-2)}
.tx-nav button:focus-visible{outline:1px solid var(--lime);outline-offset:2px}
.tx-nav button[aria-selected="true"]{border-color:rgba(212,255,58,.35);background:var(--panel-2)}
.tx-nav button[aria-selected="true"]::before{--c:var(--lime)}
.tx-nav button[aria-selected="true"]::after{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.tx-nav button[aria-selected="true"] b{color:var(--lime)}

/* the stage: a title, a row of readouts, and the chart */
.tx-stage{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 18px 10px}
.tx-stage-h{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tx-stage-h h1{margin:0;font:600 22px/1.15 var(--ui);letter-spacing:.02em}
.tx-stage-h h1 small{display:block;font:500 11px var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.tx-kpis{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.tx-kpi{display:flex;flex-direction:column;gap:2px;min-width:74px}
.tx-kpi span{font:500 10px var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tx-kpi b{font:500 22px/1 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tx-kpi b em{font-style:normal;font-size:12px;color:var(--mute);margin-left:2px}
.tx-kpi b.mint{color:var(--mint);text-shadow:0 0 14px rgba(52,245,176,.35)}.tx-kpi b.coral{color:var(--coral)}.tx-kpi b.lime{color:var(--lime)}
.tx-plot{position:relative;flex:1;min-height:0;margin-top:8px}
.tx-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;font-family:var(--num)}
.tx-over{position:absolute;inset:0;pointer-events:none}

/* chart vocabulary */
.tx-plot text{fill:var(--mute);font-size:11px}
.tx-plot .t-strong{fill:var(--text)}
.tx-plot .t-lime{fill:var(--lime)}
.tx-plot .t-ui{font-family:var(--ui);letter-spacing:.08em}
.tx-plot .hit{fill:transparent;cursor:pointer}
.enter .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:tx-draw 1.3s cubic-bezier(.6,.05,.25,1) forwards}
.enter .fade{opacity:0;animation:tx-fade .6s ease forwards;animation-delay:calc(var(--i,0) * 45ms + 250ms)}
.enter .grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:tx-grow .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 35ms)}
.enter .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:tx-pop .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i,0) * 18ms + 150ms)}
.pulse{transform-box:fill-box;transform-origin:center;animation:tx-pulse 1.6s ease-in-out infinite}
@keyframes tx-draw{to{stroke-dashoffset:0}}
@keyframes tx-fade{to{opacity:1}}
@keyframes tx-grow{to{transform:scaleY(1)}}
@keyframes tx-pop{to{transform:scale(1)}}
@keyframes tx-pulse{50%{transform:scale(1.35);opacity:.45}}

/* cards laid over the loop diagram */
.tx-card{position:absolute;width:196px;padding:9px 11px 10px;pointer-events:auto}
.tx-card b{display:flex;align-items:center;gap:8px;font:600 11px var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tx-card b i{font-style:normal;color:var(--dim)}
.tx-card span{display:block;margin-top:4px;font:500 13px/1.3 var(--ui);color:var(--text)}
.tx-card .pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tx-card .pips i{width:9px;height:9px;background:var(--mint);box-shadow:0 0 6px rgba(52,245,176,.5)}
.tx-card .pips i.bad{background:var(--coral);box-shadow:0 0 6px rgba(255,90,110,.6)}
.tx-card .bar{height:3px;margin-top:7px;background:rgba(255,255,255,.08)}
.tx-card .bar i{display:block;height:100%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.tx-card.keep{border-color:rgba(52,245,176,.5)}.tx-card.keep b{color:var(--mint)}
.tx-card.drop{border-color:rgba(255,90,110,.5)}.tx-card.drop b{color:var(--coral)}
.tx-card.now{border-color:var(--lime)}.tx-card.now::before{--c:var(--lime)}.tx-card.now b{color:var(--lime)}
.enter .tx-card{opacity:0;animation:tx-fade .5s ease forwards;animation-delay:calc(var(--i,0) * 70ms + 300ms)}

/* the facts for the selected run */
.tx-facts{grid-column:3;grid-row:2;overflow:auto;padding:16px 18px;min-height:0}
.f-h{display:flex;align-items:center;gap:10px}
.f-h h2{margin:0;font:600 30px/1 var(--ui);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.f-h h2 small{font:500 13px var(--num);color:var(--mute);margin-left:6px}
.f-tag{margin-left:auto;font:600 11px var(--num);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line-2);color:var(--slate)}
.f-tag.keep{color:var(--mint);border-color:rgba(52,245,176,.5);box-shadow:inset 0 0 12px rgba(52,245,176,.12)}
.f-tag.drop{color:var(--coral);border-color:rgba(255,90,110,.5);box-shadow:inset 0 0 12px rgba(255,90,110,.12)}
.f-tag.resolved{color:var(--lime);border-color:rgba(212,255,58,.5)}
.f-what{margin:14px 0 4px;font:600 17px/1.3 var(--ui)}
.f-what em{font-style:normal;font-weight:400;color:var(--mute);font-size:13px}
.f-why{margin:0 0 14px;color:#B9C4CB;font-size:13px}
.f-why q{color:var(--text)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.f-k{display:block;font:500 10px var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.f-v{display:block;margin-top:4px;font:500 20px/1.1 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.f-v em{font-style:normal;font-size:12px;color:var(--mute);margin-left:2px}
.f-v.mint{color:var(--mint)}.f-v.coral{color:var(--coral)}
.f-small{margin:10px 0 0;font-size:12px;color:var(--mute)}
.f-small b{color:var(--text);font-weight:500}
.f-list{list-style:none;margin:8px 0 0;padding:0}
.f-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;color:#B9C4CB}
.f-list li:last-child{border-bottom:0}
.f-list li b{font:500 12px var(--num);color:var(--text);white-space:nowrap}
.f-list li.hot{color:var(--lime)}.f-list li.hot b{color:var(--lime)}
.f-claim{margin:12px 0;padding:10px 12px;border-left:2px solid var(--slate);background:rgba(255,255,255,.03);font-size:13px}
.f-claim.resolved{border-left-color:var(--lime)}
.f-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mute)}
.f-legend span{display:inline-flex;align-items:center;gap:6px}
.f-legend i{width:9px;height:9px}

/* the run scrubber */
.tx-scrub{grid-column:2;grid-row:3;display:flex;align-items:center;gap:14px;padding:8px 14px;min-width:0}
.tx-play{flex:none;width:34px;height:34px;border:1px solid var(--lime);background:transparent;color:var(--lime);cursor:pointer;font-size:11px;
  box-shadow:0 0 12px rgba(212,255,58,.2) inset}
.tx-play:hover{background:var(--lime);color:#000}
.tx-rail{position:relative;flex:1;display:flex;justify-content:space-between;align-items:center;height:38px;min-width:0}
.tx-rail::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:1px;background:var(--line-2)}
.tx-run{position:relative;z-index:1;width:28px;height:28px;border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;
  font:500 11px var(--num);color:var(--mute);display:grid;place-items:center;transform:rotate(45deg);padding:0}
.tx-run span{transform:rotate(-45deg)}
.tx-run.keep{border-color:rgba(52,245,176,.55)}.tx-run.drop{border-color:rgba(255,90,110,.55)}
.tx-run:hover{border-color:var(--text);color:var(--text)}
.tx-run[aria-current="true"]{border-color:var(--lime);color:#000;background:var(--lime);box-shadow:0 0 16px rgba(212,255,58,.5)}
.tx-note{grid-column:3;grid-row:3;align-self:center;margin:0;font-size:11px;color:var(--dim)}
.tx-note b{color:var(--mute);font-weight:500}

.tx-tip{position:fixed;z-index:20;pointer-events:none;max-width:280px;padding:8px 10px;background:rgba(7,9,11,.95);border:1px solid var(--line-3);
  font-size:12px;color:#B9C4CB;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tx-tip b{display:block;font:600 12px var(--num);letter-spacing:.08em;color:var(--text);margin-bottom:3px}

@media (max-width:1180px){
  .tx{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:62px auto minmax(0,1fr) auto}
  .tx-nav{grid-column:1/-1;grid-row:2;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .tx-nav button{flex:none;padding:9px 14px}
  .tx-nav button em{display:none}
  .tx-stage{grid-column:1;grid-row:3}
  .tx-facts{grid-column:2;grid-row:3}
  .tx-scrub{grid-column:1;grid-row:4}
  .tx-note{grid-column:2;grid-row:4}
}
@media (max-width:760px){
  body{overflow:auto}
  .tx{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;padding:0 12px 16px}
  .tx-top{flex-wrap:wrap;padding:12px 0 0;gap:10px}
  .tx-top-r{width:100%;margin-left:0;gap:8px}
  .tx-link{padding:6px 9px;font-size:11px;letter-spacing:.08em}
  .tx-src{margin-right:auto}
  .tx-nav,.tx-stage,.tx-facts,.tx-scrub,.tx-note{grid-column:1;grid-row:auto}
  .tx-stage{height:62vh;padding:12px}
  .tx-stage-h h1{font-size:18px}
  .tx-kpis{margin-left:0;gap:14px}
  .tx-kpi b{font-size:18px}
  .tx-card{width:140px;padding:6px 8px}.tx-card span{font-size:11px}
  .tx-run{width:22px;height:22px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .tx-bg::after,.pulse,.tx-src.live i{animation:none}
  .enter .draw,.enter .fade,.enter .grow,.enter .pop,.enter .tx-card{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
}

/* The mode layer: the one thing every surface of this site must say out loud.
   The season published here is stubbed: real pages and real audits, scripted loop. Nothing on the
   page calls a model until a visitor supplies their own key. That is worth stating on every page
   rather than in a footnote on one, so this file is injected into all of them — including
   /telemetry, which has a different palette and different typefaces. So it declares its own
   colours and carries a font stack that degrades to whatever the host page loaded. */
.scrm{--scrm-night:#06081A;--scrm-line:#121A4A;--scrm-gold:#F4C542;--scrm-green:#2FD968;
  --scrm-amber:#FFA318;--scrm-cap:#C8CBD8;--scrm-mid:#6A6F8A;
  --scrm-pixel:"Press Start 2P","JetBrains Mono",ui-monospace,monospace;
  --scrm-read:"VT323","JetBrains Mono",ui-monospace,monospace}

/* ---- the badge: always there, never in the way ---------------------------------------- */
.scrm-badge{position:fixed;left:14px;bottom:14px;z-index:2147483000;display:flex;
  align-items:center;gap:9px;padding:9px 13px;border:2px solid var(--scrm-line);
  background:rgba(6,8,26,.94);color:#FFF;font-family:var(--scrm-pixel);font-size:8px;
  letter-spacing:.6px;text-transform:uppercase;cursor:pointer;line-height:1}
.scrm-badge:hover{border-color:var(--scrm-gold)}
.scrm-badge b{font:inherit;color:var(--scrm-amber)}
.scrm-badge.live b{color:var(--scrm-green)}
.scrm-badge i{width:8px;height:8px;background:var(--scrm-amber);font-style:normal;
  animation:scrm-pulse 2.4s ease-in-out infinite}
.scrm-badge.live i{background:var(--scrm-green);animation:none}
.scrm-badge s{text-decoration:none;color:var(--scrm-mid);font-family:var(--scrm-read);
  font-size:16px;letter-spacing:0}
@keyframes scrm-pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.scrm-badge i{animation:none}}

/* ---- the panel ------------------------------------------------------------------------ */
.scrm-veil{position:fixed;inset:0;z-index:2147483001;background:rgba(2,3,10,.86);
  display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px}
.scrm-veil[hidden]{display:none}
.scrm-panel{width:min(860px,100%);border:2px solid var(--scrm-line);background:var(--scrm-night);
  color:#FFF;font-family:var(--scrm-read);font-size:19px;line-height:23px}
.scrm-head{display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:2px solid var(--scrm-line)}
.scrm-chq{width:16px;height:16px;flex:none;
  background:repeating-conic-gradient(var(--scrm-gold) 0 25%,#0B1038 0 50%) 0 0/16px 16px}
.scrm-head h2{margin:0;flex:1;font-family:var(--scrm-pixel);font-size:11px;letter-spacing:1px;
  text-transform:uppercase;color:#FFF}
.scrm-x{font-family:var(--scrm-pixel);font-size:8px;background:none;color:var(--scrm-cap);
  border:2px solid var(--scrm-line);padding:8px 11px;cursor:pointer;letter-spacing:.5px}
.scrm-x:hover{border-color:var(--scrm-gold);color:#FFF}
.scrm-body{padding:18px 16px 20px}
.scrm-lede{margin:0 0 6px;font-family:var(--scrm-pixel);font-size:13px;line-height:21px;
  letter-spacing:.5px;color:var(--scrm-gold)}
.scrm-sub{margin:0 0 18px;color:var(--scrm-cap)}

/* the two columns: what is already real, and what a key adds */
.scrm-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px}
.scrm-col{border:2px solid var(--scrm-line);padding:12px 13px 14px}
.scrm-col h3{margin:0 0 9px;font-family:var(--scrm-pixel);font-size:8px;letter-spacing:.7px;
  text-transform:uppercase}
.scrm-col.real h3{color:var(--scrm-green)}
.scrm-col.key h3{color:var(--scrm-amber)}
.scrm-col ul{margin:0;padding-left:17px;color:var(--scrm-cap)}
.scrm-col li{margin:0 0 5px}
/* The host pages set <b> to the pixel typeface globally, which turns an emphasised phrase inside
   a sentence into a headline. In here <b> only means "this is the important phrase". */
.scrm-col b,.scrm-sub b,.scrm-note b{font-family:var(--scrm-read);font-size:inherit;
  font-weight:400;letter-spacing:0;text-transform:none;color:#FFF}

/* the key row */
.scrm-key{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap;margin:0 0 8px}
.scrm-key input{flex:1;min-width:220px;background:#04060F;border:2px solid var(--scrm-line);
  color:#FFF;font-family:var(--scrm-read);font-size:19px;padding:9px 11px}
.scrm-key input:focus{outline:none;border-color:var(--scrm-gold)}
.scrm-key button{font-family:var(--scrm-pixel);font-size:9px;letter-spacing:.5px;padding:10px 14px;
  border:2px solid var(--scrm-gold);background:var(--scrm-gold);color:#000;cursor:pointer}
.scrm-key button.ghost{background:none;color:var(--scrm-cap);border-color:var(--scrm-line)}
.scrm-key button.ghost:hover{border-color:var(--scrm-gold);color:#FFF}
.scrm-note{margin:0 0 18px;color:var(--scrm-mid);font-size:17px;line-height:21px}
.scrm-note.ok{color:var(--scrm-green)}
.scrm-note.bad{color:#E31E2D}

/* the surfaces: the reason the panel is worth opening even if you never paste a key */
.scrm-nav h3{margin:0 0 10px;font-family:var(--scrm-pixel);font-size:8px;letter-spacing:.7px;
  text-transform:uppercase;color:var(--scrm-cap)}
.scrm-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.scrm-tile{display:block;border:2px solid var(--scrm-line);padding:11px 12px 12px;
  text-decoration:none;color:#FFF;position:relative}
.scrm-tile:hover{border-color:var(--scrm-gold);background:#0A0E28}
.scrm-tile[aria-current]{border-color:var(--scrm-gold)}
.scrm-tile b{display:block;font-family:var(--scrm-pixel);font-size:8px;letter-spacing:.5px;
  margin:0 0 6px;text-transform:uppercase}
.scrm-tile span{display:block;color:var(--scrm-cap);font-size:17px;line-height:20px}
.scrm-tile em{position:absolute;top:9px;right:10px;font-style:normal;font-family:var(--scrm-pixel);
  font-size:7px;color:var(--scrm-mid)}
.scrm-foot{margin:16px 0 0;color:var(--scrm-mid);font-size:17px}
.scrm-foot kbd{font-family:var(--scrm-pixel);font-size:8px;border:2px solid var(--scrm-line);
  padding:3px 5px;color:var(--scrm-cap)}

@media (max-width:720px){
  .scrm-two,.scrm-tiles{grid-template-columns:1fr}
  .scrm-badge{left:8px;bottom:8px;font-size:7px}
}

/* A page that nominated its own element as the trigger. It keeps its own look; this only makes it
   read as clickable, and marks it when a visitor's key is in play. */
[data-scrm-anchored]{cursor:pointer}
[data-scrm-anchored]:hover{filter:brightness(1.35)}
[data-scrm-anchored]:focus-visible{outline:2px solid var(--scrm-gold);outline-offset:2px}
[data-scrm-anchored][data-scrm-live]::after{content:" · YOUR KEY";color:var(--scrm-green);letter-spacing:.5px}

</style>

<!-- Scrutineer telemetry: the season as flat, vector instrument graphics. No 3D models, no car and
     no track — those belong to the broadcast and the pit board. Every number is read from the loop. -->
<div class="tx-bg" aria-hidden="true"></div>
<div class="tx" id="tx">
  <header class="tx-top">
    <a class="tx-mark" href="/telemetry"><span class="tx-glyph" aria-hidden="true"></span><b>SCRUTINEER</b><em>TELEMETRY</em></a>
    <div class="tx-top-r">
      <span class="tx-src" id="src" data-scrm-anchor><i></i><b>—</b></span>
      <a class="tx-link" href="/">Broadcast ↗</a>
      <a class="tx-link" href="/pit">Pit board ↗</a>
    </div>
  </header>
  <nav class="tx-nav" id="nav" aria-label="Charts">
    <button class="hud" type="button" data-st="loop"><b>How does a run work?</b><em>seven steps, and what this run did at each</em></button>
    <button class="hud" type="button" data-st="progress"><b>Is it getting faster?</b><em>the held-out lap time, run by run</em></button>
    <button class="hud" type="button" data-st="interfaces"><b>What did it build?</b><em>every page, and what the audit found</em></button>
    <button class="hud" type="button" data-st="components"><b>Which part changed?</b><em>ten components: levels and blame</em></button>
    <button class="hud" type="button" data-st="benchmark"><b>Does it hold up outside?</b><em>a public benchmark it did not write</em></button>
  </nav>
  <main class="tx-stage hud" id="stage">
    <div class="tx-stage-h" id="head"></div>
    <div class="tx-plot" id="plot">
      <svg id="chart" role="img" aria-labelledby="chartTitle" xmlns="http://www.w3.org/2000/svg"><title id="chartTitle">chart</title></svg>
      <div class="tx-over" id="over"></div>
    </div>
  </main>
  <aside class="tx-facts hud" id="facts" aria-live="polite"></aside>
  <div class="tx-scrub hud" id="scrub"></div>
  <p class="tx-note" id="note"></p>
</div>
<div class="tx-tip" id="tip" hidden></div>

    s += text(x, y + 4, `0${i + 1}`, { 'text-anchor': 'middle', fill: now ? C.lime : decide ? stroke : C.text, 'font-size': 11, style: 'pointer-events:none' });

}

// ============================================================================
// Is it getting faster? The held-out lap against its own measurement, with every gate.
// ============================================================================
function drawProgress() {
  const W = V.W, H = V.H, R = S.all, N = R.length, title = 'Is it getting faster?';
  if (!N) return { title, head: head('Held-out lap time', title, []), svg: emptyChart('No run has been scored yet') };
  const sel = R[V.sel], first = R.find(r => num(r.official_s));
  const best = R.reduce((b, r, i) => num(r.official_s) && (b < 0 || r.official_s < R[b].official_s) ? i : b, -1);
  const gain = first && num(sel.official_s) ? first.official_s - sel.official_s : null;
  const gAll = R.reduce((a, r) => a + r.gates.length, 0), gOk = R.reduce((a, r) => a + r.gates.filter(g => g.ok).length, 0);
  const kpis = [
    ['Since run 1', gain === null ? '—' : gain > 0.005 ? `−${fmt(gain)}` : '0.00', gain > 0.005 ? 'mint' : '', 's'],
    ['Best lap', best < 0 ? '—' : fmt(R[best].official_s), 'lime', best < 0 ? '' : `s · run ${best + 1}`],
    ['Kept', `${R.filter(r => r.promoted).length}/${N}`, ''],
    ['Gates cleared', gAll ? `${gOk}/${gAll}` : '—', ''],
  ];
  const m = { l: 52, r: 16, t: 34, b: 74 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = R.flatMap(r => [r.official_s, r.claimed_s]).filter(num), mn = Math.min(...vals), mx = Math.max(...vals), span = Math.max(1, mx - mn);
  const step = niceStep(span / 4), lo = Math.floor((mn - span * 0.12) / step) * step, hi = Math.ceil((mx + span * 0.12) / step) * step;
  const bw = iw / N, X = i => m.l + bw * (i + 0.5), Y = v => m.t + ih - (v - lo) / (hi - lo) * ih, base = m.t + ih;
  let s = '';
  for (let v = lo; v <= hi + 1e-9; v += step) { const y = n1(Y(v)); s += el('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: C.line, 'stroke-dasharray': '2 5' }) + text(m.l - 10, y + 4, `${+v.toFixed(2)}`, { 'text-anchor': 'end' }); }
  s += text(m.l - 10, m.t - 16, 'sec', { 'text-anchor': 'end' });
  const sx = X(V.sel);
  s += el('rect', { x: n1(sx - bw / 2 + 2), y: m.t - 8, width: n1(Math.max(2, bw - 4)), height: n1(ih + 8), fill: 'url(#band)' });
  s += el('line', { x1: n1(sx), x2: n1(sx), y1: m.t - 8, y2: base, stroke: C.lime, 'stroke-opacity': .4, 'stroke-dasharray': '3 3' });
  s += el('line', { x1: m.l, x2: W - m.r, y1: base, y2: base, stroke: C.line2 });
  const pts = R.map((r, i) => num(r.official_s) ? [X(i), Y(r.official_s)] : null).filter(Boolean);
  const own = R.map((r, i) => num(r.claimed_s) ? [X(i), Y(r.claimed_s)] : null).filter(Boolean);
  const line = p => p.map((q, k) => `${k ? 'L' : 'M'}${n1(q[0])},${n1(q[1])}`).join('');
  if (pts.length > 1) {
    s += el('path', { d: `${line(pts)}L${n1(pts[pts.length - 1][0])},${base}L${n1(pts[0][0])},${base}Z`, fill: 'url(#area)', class: 'fade' });
    if (own.length > 1) s += el('path', { d: line(own), fill: 'none', stroke: C.violet, 'stroke-width': 1.4, 'stroke-dasharray': '5 5', 'stroke-opacity': .85, class: 'fade' });
    s += el('path', { d: line(pts), fill: 'none', stroke: C.ice, 'stroke-width': 7, 'stroke-opacity': .1, class: 'draw' });
    s += el('path', { d: line(pts), fill: 'none', stroke: C.ice, 'stroke-width': 2, filter: 'url(#g1)', class: 'draw' });
  }
  for (let i = 1; i < N; i++) {
    const a = R[i - 1], b = R[i]; if (!num(a.official_s) || !num(b.official_s) || bw < 34) continue;
    const d = b.official_s - a.official_s; if (Math.abs(d) < 0.005) continue;
    s += text((X(i - 1) + X(i)) / 2, Math.min(Y(a.official_s), Y(b.official_s)) - 12, `${d < 0 ? '−' : '+'}${fmt(Math.abs(d))}`,
      { 'text-anchor': 'middle', fill: d < 0 ? C.mint : C.coral, 'font-size': 10, class: 'fade', style: `--i:${i}` });
  }
  R.forEach((r, i) => {
    if (!num(r.official_s)) return;

    if (on) s += el('circle', { cx: x, cy: y, r: 13, fill: 'none', stroke: C.lime, 'stroke-opacity': .55, class: 'pulse' });
    s += el('circle', { cx: x, cy: y, r: on ? 6.5 : 5, fill: C.bg, stroke: VC[v], 'stroke-width': 2.4, filter: 'url(#g1)', class: 'pop', style: `--i:${i}` });
    if (on) s += el('circle', { cx: x, cy: y, r: 2.6, fill: C.lime });
  });
  if (num(sel.official_s)) {
    const lbl = `${fmt(sel.official_s)} s`, tw = lbl.length * 7.3 + 16, x = X(V.sel), y = Y(sel.official_s);
    const tx = clamp(x - tw / 2, m.l, W - m.r - tw), ty = Math.max(2, y - 40);
    s += el('path', { d: `M${n1(x)},${n1(ty + 22)}L${n1(x)},${n1(y - 14)}`, stroke: C.lime, 'stroke-opacity': .6 });
    s += el('rect', { x: n1(tx), y: n1(ty), width: n1(tw), height: 22, fill: C.bg, stroke: C.lime });
    s += text(tx + tw / 2, ty + 15, lbl, { 'text-anchor': 'middle', fill: C.lime, 'font-size': 12 });

  R.forEach((r, i) => {
    const x = X(i), on = i === V.sel;

    const g = r.gates, n = g.length;
    if (!n) { s += el('line', { x1: n1(x - 5), x2: n1(x + 5), y1: base + 34, y2: base + 34, stroke: C.dim }); return; }
    const cols = Math.max(2, Math.min(n, Math.floor((bw - 8) / 7))), sz = Math.max(3, Math.min(5, (bw - 8) / cols - 2));

    });
  });
  s += text(m.l - 10, base + 18, 'run', { 'text-anchor': 'end' }) + text(m.l - 10, base + 36, 'gates', { 'text-anchor': 'end' });
  const lx = Math.max(m.l + 40, W - m.r - 290);
  s += el('line', { x1: lx, x2: lx + 22, y1: m.t - 20, y2: m.t - 20, stroke: C.ice, 'stroke-width': 2 }) + text(lx + 28, m.t - 16, 'held-out lap');
  s += el('line', { x1: lx + 118, x2: lx + 140, y1: m.t - 20, y2: m.t - 20, stroke: C.violet, 'stroke-dasharray': '5 4', 'stroke-width': 1.4 }) + text(lx + 146, m.t - 16, 'its own measurement');
  R.forEach((r, i) => { s += el('rect', { class: 'hit', x: n1(X(i) - bw / 2), y: m.t - 8, width: n1(bw), height: n1(ih + 66), 'data-run': i }); });
  return { title, head: head('Held-out lap time · lower is faster', title, kpis), svg: s };
}

// ============================================================================
// What did it build? An audit matrix: every page family, every run.
// ============================================================================
let CELLS = [];
function drawInterfaces() {
  const W = V.W, H = V.H, R = S.all, title = 'What did it build?';
  const part = window.SCRUTINEER_PARTITION;
  const fams = [...new Set([...(part && part.families || []), ...R.flatMap(r => r.pages.map(p => p.family))])].filter(Boolean);
  if (!R.length || !fams.length) return { title, head: head('The audit of every page', title, []), svg: emptyChart('No interfaces audited yet') };
  const r = R[V.sel], passed = r.pages.filter(p => p.passed).length, weighted = r.pages.reduce((a, p) => a + (p.weighted || 0), 0), critical = r.pages.reduce((a, p) => a + (p.critical || 0), 0);
  const allPages = R.reduce((a, x) => a + x.pages.length, 0), allPassed = R.reduce((a, x) => a + x.pages.filter(p => p.passed).length, 0);
  const kpis = [['Passed this run', `${passed}/${r.pages.length}`, passed === r.pages.length ? 'mint' : ''], ['Weighted violations', `${weighted}`, weighted ? 'coral' : 'mint'],
    ['Critical', `${critical}`, critical ? 'coral' : ''], ['Season pass rate', allPages ? pct(allPassed / allPages) : '—', '', '%']];
  CELLS = [];
  R.forEach((run, ri) => fams.forEach((f, fi) => {
    const pages = run.pages.filter(p => p.family === f);
    CELLS.push({ ri, fi, f, pages, passed: pages.filter(p => p.passed).length, weighted: pages.reduce((a, p) => a + (p.weighted || 0), 0),
      critical: pages.reduce((a, p) => a + (p.critical || 0), 0), rules: [...new Set(pages.flatMap(p => (p.rules || []).map(ruleId)))].filter(Boolean) });
  }));
  const N = R.length, F = fams.length, m = { l: 40, r: 108, t: 84, b: 56 };
  const cell = Math.max(10, Math.min((W - m.l - m.r) / F, (H - m.t - m.b) / N)), gw = cell * F, gh = cell * N;
  const ox = m.l + Math.max(0, (W - m.l - m.r - gw) / 2), oy = m.t;
  const maxW = Math.max(1, ...CELLS.map(c => c.weighted));
  let s = '';
  fams.forEach((f, fi) => { const x = ox + (fi + 0.5) * cell; s += `<text transform="translate(${n1(x)},${n1(oy - 10)}) rotate(-40)" style="fill:${C.mute}">${esc(f)}</text>`; });
  CELLS.forEach((c, k) => {
    const x = ox + c.fi * cell, y = oy + c.ri * cell, pad = Math.max(1.5, cell * 0.06), size = cell - pad * 2, on = c.ri === V.sel;
    const col = !c.pages.length ? C.dim : c.passed === c.pages.length ? C.mint : c.passed === 0 ? C.coral : C.amber;
    const dim = on ? 1 : 0.45;
    if (!c.pages.length) { s += el('rect', { x: n1(x + pad), y: n1(y + pad), width: n1(size), height: n1(size), fill: 'none', stroke: C.line, 'stroke-dasharray': '2 3' }); return; }
    s += el('rect', { x: n1(x + pad), y: n1(y + pad), width: n1(size), height: n1(size), fill: col, 'fill-opacity': .07 * dim, stroke: col, 'stroke-opacity': .38 * dim });
    const norm = Math.log1p(c.weighted) / Math.log1p(maxW), core = size * (c.weighted ? 0.26 + 0.64 * Math.sqrt(norm) : 0.2);
    s += el('rect', { x: n1(x + cell / 2 - core / 2), y: n1(y + cell / 2 - core / 2), width: n1(core), height: n1(core), fill: col, 'fill-opacity': .88 * dim,
      filter: on && (c.critical || c.passed === 0) ? 'url(#g1)' : null, class: 'pop', style: `--i:${Math.round((c.ri + c.fi) * 1.5)}` });
    s += el('rect', { class: 'hit', x: n1(x), y: n1(y), width: n1(cell), height: n1(cell), 'data-cell': k });
  });
  R.forEach((run, ri) => {
    const y = oy + (ri + 0.5) * cell, on = ri === V.sel;
    s += text(ox - 10, y + 4, `${ri + 1}`, { 'text-anchor': 'end', fill: on ? C.lime : C.mute });
    const bx = ox + gw + 16, bwid = Math.min(58, m.r - 50), ratio = run.pages.length ? run.pages.filter(p => p.passed).length / run.pages.length : 0;
    s += el('rect', { x: n1(bx), y: n1(y - 2), width: bwid, height: 4, fill: 'rgba(255,255,255,.06)' });
    s += el('rect', { x: n1(bx), y: n1(y - 2), width: n1(bwid * ratio), height: 4, fill: C.mint, 'fill-opacity': on ? 1 : .5, filter: on ? 'url(#g1)' : null, class: 'grow', style: `--i:${ri};transform-origin:0 50%` });
    s += text(bx + bwid + 6, y + 4, `${run.pages.filter(p => p.passed).length}/${run.pages.length}`, { fill: on ? C.text : C.mute, 'font-size': 10 });
  });
  s += text(ox + gw + 16, oy - 10, 'passed', { 'font-size': 10 });
  s += text(ox - 10, oy - 10, 'run', { 'text-anchor': 'end', 'font-size': 10 });
  const sy = oy + (V.sel) * cell;
  s += el('rect', { x: n1(ox - 3), y: n1(sy - 1), width: n1(gw + 6), height: n1(cell + 2), fill: 'none', stroke: C.lime, 'stroke-opacity': .7, filter: 'url(#g1)' });
  const totals = fams.map((f, fi) => CELLS.filter(c => c.fi === fi).reduce((a, c) => a + c.weighted, 0)), maxT = Math.max(1, ...totals), by = oy + gh + 14;
  totals.forEach((t, fi) => {
    const h = t ? 4 + 24 * t / maxT : 1, x = ox + fi * cell + cell * 0.3;
    s += el('rect', { x: n1(x), y: n1(by), width: n1(cell * 0.4), height: n1(h), fill: C.amber, 'fill-opacity': .75, class: 'fade', style: `--i:${fi}` });
  });
  s += text(ox - 10, by + 10, 'season', { 'text-anchor': 'end', 'font-size': 10 });
  return { title, head: head('The audit of every page, run by run', title, kpis), svg: s };
}

// ============================================================================
// Which part changed? A radial of component levels, with the blame each took.
// ============================================================================
function drawComponents() {
  const W = V.W, H = V.H, r = S.all[V.sel], title = 'Which part changed?';
  if (!r) return { title, head: head('Component levels and blame', title, []), svg: emptyChart('No run decided yet') };
  const lv = levelsAfter(V.sel + 1), st = r.standings || {}, v = verdictOf(r);
  const blamed = Object.values(st).reduce((a, x) => a + ((x && x.n) || 0), 0), maxN = Math.max(1, ...Object.values(st).map(x => (x && x.n) || 0));
  const kpis = [['Picked', r.role ? NAME[r.role] : '—', 'lime'], ['Outcome', verdictWord(v), v === 'keep' ? 'mint' : v === 'drop' ? 'coral' : ''],
    ['Total levels', `${Object.values(lv).reduce((a, x) => a + x, 0)}`, '', 'of 10 at start'], ['Pages blamed', `${blamed}`, blamed ? '' : 'mint']];
  const narrow = W < 620, cx = W / 2, cy = H / 2 + 4, Rmax = Math.max(70, Math.min(W * (narrow ? 0.26 : 0.3), H * 0.4));
  const R0 = Rmax * 0.3, R1 = Rmax * 0.8, SEG = 5, segH = (R1 - R0) / SEG, slot = 30, wid = slot * 0.64;
  const angleOf = k => { const c = CORE.indexOf(k); return c >= 0 ? -90 + (c - 2.5) * slot : 90 + (SUPPORT.indexOf(k) - 1.5) * slot; };
  let s = el('circle', { cx, cy, r: Rmax, fill: 'url(#core)' });
  s += el('circle', { cx, cy, r: R0 - 6, fill: 'none', stroke: C.line2 }) + el('circle', { cx, cy, r: R1 + 6, fill: 'none', stroke: C.line, 'stroke-dasharray': '2 4' });
  if (!narrow) {
    for (let k = 1; k <= SEG; k++) { const [x, y] = polar(cx, cy, R0 + (k - 0.5) * segH, 15); s += text(x, y + 3, `L${k}`, { 'text-anchor': 'middle', 'font-size': 9, fill: C.dim }); }
    s += text(cx, cy - R0 + 18, 'CORE', { 'text-anchor': 'middle', 'font-size': 9, 'letter-spacing': '.2em', fill: C.dim });
    s += text(cx, cy + R0 - 10, 'SUPPORT', { 'text-anchor': 'middle', 'font-size': 9, 'letter-spacing': '.2em', fill: C.dim });
  }
  [...CORE, ...SUPPORT].forEach((k, idx) => {
    const a = angleOf(k), a0 = a - wid / 2, a1 = a + wid / 2, level = lv[k] || 1, picked = r.role === k;
    for (let g = 0; g < SEG; g++) {
      const r0 = R0 + g * segH + 1.5, r1 = r0 + segH - 3, lit = g < level, gained = picked && v === 'keep' && g === level - 1, refused = picked && v === 'drop' && g === level;
      const d = wedge(cx, cy, r0, r1, a0, a1);
      if (gained) s += el('path', { d, fill: C.mint, filter: 'url(#g2)', class: 'fade', style: `--i:${g + idx}` });
      else if (refused) s += el('path', { d, fill: 'url(#hatch)', stroke: C.coral, 'stroke-width': 1.2, class: 'fade', style: `--i:${g + idx}` });
      else if (lit) s += el('path', { d, fill: C.ice, 'fill-opacity': .32 + g * 0.1, stroke: C.ice, 'stroke-opacity': .5, class: 'fade', style: `--i:${g + idx}` });
      else s += el('path', { d, fill: 'none', stroke: C.line });
    }
    if (level > SEG) { const [x, y] = polar(cx, cy, R1 + 2, a); s += text(x, y, `+${level - SEG}`, { 'text-anchor': 'middle', fill: C.ice, 'font-size': 10 }); }
    const n = (st[k] && st[k].n) || 0;
    if (n) {
      const t = 3 + (n / maxN) * 14;
      s += el('path', { d: wedge(cx, cy, R1 + 10, R1 + 10 + t, a0, a1), fill: C.amber, 'fill-opacity': .85, filter: 'url(#g1)', class: 'fade', style: `--i:${idx + 5}` });
      const [bx, by] = polar(cx, cy, R1 + 18 + t, a); s += text(bx, by + 4, `${n}`, { 'text-anchor': 'middle', fill: C.amber, 'font-size': 10 });
    }
    if (picked) s += el('path', { d: wedge(cx, cy, R0 - 2, R1 + 4, a0 - 2, a1 + 2), fill: 'none', stroke: C.lime, 'stroke-width': 1.2, filter: 'url(#g1)' });
    const [lx, ly] = polar(cx, cy, Rmax + (narrow ? 20 : 30), a), cos = Math.cos(a * Math.PI / 180);
    const anchor = cos > 0.3 ? 'start' : cos < -0.3 ? 'end' : 'middle';
    s += text(lx, ly, NAME[k], { 'text-anchor': anchor, class: 't-ui', fill: picked ? C.lime : C.text, 'font-size': narrow ? 10 : 12, 'font-weight': 600 });
    if (!narrow) s += text(lx, ly + 14, JOB[k], { 'text-anchor': anchor, 'font-size': 10, fill: C.mute });
    s += el('path', { class: 'hit', d: wedge(cx, cy, R0 - 6, Rmax + 12, a - slot / 2, a + slot / 2), 'data-role': k });

  s += text(cx, cy - 4, `RUN ${V.sel + 1}`, { 'text-anchor': 'middle', class: 't-ui t-strong', 'font-size': narrow ? 12 : 20, 'font-weight': 600 });

    g += text(gx, gy + gR + 30, label, { 'text-anchor': 'middle', class: 't-ui', fill: color, 'font-size': 11, 'letter-spacing': '.12em' });

    s += el('rect', { x: n1(mx - 40), y: n1(my - 11), width: 80, height: 22, fill: C.bg, stroke: d > 0 ? C.mint : C.coral });

// SCR.mode — what this site is, said on every page.

// The season published here is a stub. Its two hundred pages are real documents, really audited

// pages (research/LEDGER.md says so: "it is not evidence about the loop"). The measured findings
// come from real runs and are labelled where they appear. No model is called when you load a
// page, and none should be — a public site that spends someone else's inference budget on every
// visitor is a site that gets turned off.

//

//   LIVE  — a visitor pasted their own key. The comparison on /watch now calls a model for real.
//
// The key is held for the tab and nowhere else (sessionStorage, cleared when the tab closes, with
// a FORGET button that clears it sooner). It is never sent anywhere except this site's own relay,

  { href: BASE + '/', name: 'FRONT DOOR', at: ['/', '/index.html'],
    says: 'The one idea, in three pictures: it builds, it finds the cause, ten checks decide.' },
  { href: BASE + '/watch', name: 'WATCH A SEASON', at: ['/watch', '/watch.html'],
    says: 'Ten runs as a race. Blame, the ten gates, the pit stop when a change is kept.' },
  { href: BASE + '/telemetry', name: 'TELEMETRY', at: ['/telemetry', '/telemetry.html'],
    says: 'Five instrument charts on one scrubber: lap times, the audit, the outside check.' },
  { href: TIMELINE, name: 'SCRUB THE SEASON', ext: !BASE, timeline: true,
    says: 'One slider across all ten runs. Drag it and the car rebuilds at that generation.' },
  { href: BASE + '/deck', name: 'THE PITCH', at: ['/deck', '/deck.html'],
    says: 'Eight slides. What it does, how it knows, and what it got wrong.' },
  { href: BASE + '/pages/run-09/checkout-w01.html', name: 'AUDIT IT YOURSELF', ext: true,
    says: 'A real page from the season. Open it, run axe on it, check our number.' },
];

const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };

function read() { try { return sessionStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
function write(v) {
  try { v ? sessionStorage.setItem(STORE, v) : sessionStorage.removeItem(STORE); }
  catch (e) { /* a private window refuses storage; the key still works for this page */ }
}

// The key a visitor pasted, for whoever needs to make a call with it. Kept behind a function
// rather than a property so nothing can accidentally serialise it into a bundle or a log.
let memory = '';
M.key = () => memory || read();
M.live = () => !!M.key();

// A key is the visitor's money and the visitor's secret. Show enough to recognise it, never the
// rest — a screen-shared demo should not leak one.
function mask(k) {
  if (k.length <= 10) return k.slice(0, 3) + '…';
  return k.slice(0, 7) + '…' + k.slice(-4);
}

// --------------------------------------------------------------------------------------------
// the badge
// --------------------------------------------------------------------------------------------
let badge, veil;

function paintBadge() {
  const live = M.live();
  // An anchored page keeps its own chip; all it gets is a marker saying a key is in play, drawn
  // with ::after so the page repainting the chip's contents cannot wipe it.
  const anchor = document.querySelector('[data-scrm-anchored]');
  if (anchor) anchor.toggleAttribute('data-scrm-live', live);
  if (!badge) return;
  badge.className = 'scrm-badge' + (live ? ' live' : '');
  badge.innerHTML = '';
  badge.append(el('i'), el('b', null, live ? 'LIVE' : 'DEMO'),
    el('s', null, live ? 'your key · ' + mask(M.key()) : 'stubbed season · add a key to go live'));
  badge.setAttribute('aria-label', live
    ? 'Live mode: your own key is in use for this tab. Open the mode panel.'
    : 'Demo mode: this season is stubbed. Open the mode panel to go live with your own key.');
}

// --------------------------------------------------------------------------------------------
// the panel
// --------------------------------------------------------------------------------------------
function here(s) {
  if (s.timeline) return !!BASE;
  if (s.ext || BASE) return false;
  const p = location.pathname.replace(/\/+$/, '') || '/';
  return (s.at || []).some(a => a === p || (a === '/' && p === ''));
}

function buildPanel() {
  veil = el('div', 'scrm-veil'); veil.hidden = true;
  veil.setAttribute('role', 'dialog'); veil.setAttribute('aria-modal', 'true');
  veil.setAttribute('aria-label', 'What this site is, and how to run it live');

  const panel = el('div', 'scrm-panel');
  const head = el('div', 'scrm-head');
  head.append(el('span', 'scrm-chq'), el('h2', null, 'Scrutineer · demo mode'));
  const x = el('button', 'scrm-x', 'CLOSE  ESC'); x.addEventListener('click', () => M.close());
  head.append(x);

  const body = el('div', 'scrm-body');
  body.append(el('p', 'scrm-lede', 'This is the demo. The season you are watching is stubbed.'));
  const sub = el('p', 'scrm-sub');
  sub.textContent = 'Its two hundred pages are real documents, really audited in a browser — but '
    + 'the loop\'s choices across its ten runs are scripted, and no model wrote the pages. It shows '
    + 'how the loop works; it is not evidence that it works. The measured results come from real '
    + 'runs and are marked where they appear. Loading a page calls no model and spends nobody\'s '
    + 'budget. Bring your own key and one part of the site runs for real, right now.';
  body.append(sub);

  const two = el('div', 'scrm-two');
  const real = el('div', 'scrm-col real');
  real.innerHTML = '<h3>What you get without a key</h3><ul>'
    + '<li>Every page in the season, as a real document at its own URL you can audit.</li>'
    + '<li>The real browser audit that scored them — axe-core, no model judging.</li>'
    + '<li>The whole loop played out: build, blame, fix, ten checks, keep or refuse.</li>'
    + '<li>The measured findings from real runs — including the one that went against us.</li>'
    + '<li><b>Stubbed:</b> which change the loop picked each run, and the pages it wrote.</li></ul>';
  const key = el('div', 'scrm-col key');
  key.innerHTML = '<h3>What your key turns on</h3><ul>'
    + '<li>On <b>Watch a season</b>, the panel called <b>Run the comparison yourself</b>.</li>'
    + '<li>It asks a model for the same interface twice — once with the context the agent gave '
    + 'itself on run 1, once with the context it wrote for itself later.</li>'
    + '<li>Both pages are rendered and audited in your browser, by the same engine.</li>'
    + '<li>That is the whole claim of this project, checked live instead of taken.</li></ul>';
  two.append(real, key);
  body.append(two);

  const row = el('div', 'scrm-key');
  const input = el('input');
  input.type = 'password'; input.id = 'scrmKey'; input.autocomplete = 'off';
  input.spellcheck = false; input.placeholder = 'wandb_v1_…  or  sk-ant-…';
  input.setAttribute('aria-label', 'Your W&B Inference or Anthropic API key');
  const go = el('button', null, 'GO LIVE');
  const forget = el('button', 'ghost', 'FORGET KEY');
  row.append(input, go, forget);
  body.append(row);

  const note = el('p', 'scrm-note'); note.id = 'scrmNote';
  body.append(note);

  const nav = el('div', 'scrm-nav');
  nav.append(el('h3', null, 'Every surface, and what it is for'));
  const tiles = el('div', 'scrm-tiles');
  SURFACES.forEach((s, i) => {
    const a = el('a', 'scrm-tile'); a.href = s.href;
    if (s.ext) { a.target = '_blank'; a.rel = 'noopener'; }
    if (here(s)) a.setAttribute('aria-current', 'page');
    a.append(el('em', null, String(i + 1)), el('b', null, s.name + (here(s) ? ' · here' : '')),
      el('span', null, s.says));
    tiles.append(a);
  });
  nav.append(tiles);
  body.append(nav);

  const foot = el('p', 'scrm-foot');
  foot.innerHTML = 'Press <kbd>?</kbd> anywhere to open this · <kbd>1</kbd>–<kbd>6</kbd> to jump '
    + 'to a surface · <kbd>ESC</kbd> to close. The key is held for this browser tab only, is sent '
    + 'to the model endpoint through this site\'s relay, and is never stored or logged.';
  body.append(foot);

  panel.append(head, body);
  veil.append(panel);

  const setNote = (txt, kind) => {
    note.className = 'scrm-note' + (kind ? ' ' + kind : '');
    note.textContent = txt;
  };
  const apply = () => {
    const v = (input.value || '').trim();
    if (!v) return setNote('Paste a key first — or keep exploring the demo; the pages and audits are real.', 'bad');
    if (v.length < 20) return setNote('That does not look like a key.', 'bad');
    memory = v; write(v); input.value = '';
    paintBadge();
    setNote('Live for this tab. Open Watch a season and use "Run the comparison yourself".', 'ok');
  };
  go.addEventListener('click', apply);
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); apply(); } });
  forget.addEventListener('click', () => {
    memory = ''; write(''); input.value = '';
    paintBadge();
    setNote('Forgotten. Back to the demo.', 'ok');
  });

  // Clicking the backdrop closes; clicking inside it must not.
  veil.addEventListener('click', ev => { if (ev.target === veil) M.close(); });
  panel.addEventListener('click', ev => ev.stopPropagation());

  // 1–6 jump between surfaces, but only while the panel is open and only when the visitor is
  // not typing — the pages underneath already bind single letters of their own.
  veil.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); return M.close(); }
    const t = ev.target && ev.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= SURFACES.length) {
      const s = SURFACES[n - 1];
      ev.preventDefault();
      if (s.ext) window.open(s.href, '_blank', 'noopener'); else location.href = s.href;
    }
  });
  return veil;
}

M.open = function () {
  if (!veil) document.body.append(buildPanel());
  veil.hidden = false;
  const k = veil.querySelector('.scrm-x'); if (k) k.focus();
};
M.close = function () {
  if (veil) veil.hidden = true;
  const back = badge || document.querySelector('[data-scrm-anchored]');
  if (back && back.focus) back.focus();
};
M.toggle = function () { (veil && !veil.hidden) ? M.close() : M.open(); };

M.boot = function () {
  if (document.querySelector('.scrm-badge') || document.querySelector('[data-scrm-anchored]')) return;
  document.documentElement.classList.add('scrm');

  // A page that already says which season it is showing does not need a second thing saying it.
  // /telemetry has that chip in its own header, and a floating badge in the corner sat straight
  // on top of the run scrubber. So a page can nominate an element to be the trigger, and keeps
  // its own layout; every other page gets the corner badge.
  const anchor = document.querySelector('[data-scrm-anchor]');
  if (anchor) {
    // Marked with attributes, not classes: /telemetry reassigns this chip's className as it
    // repaints, which silently wiped a class and left the chip dead.
    anchor.setAttribute('data-scrm-anchored', '');
    anchor.setAttribute('role', 'button');
    anchor.setAttribute('tabindex', '0');
    anchor.title = 'What this site is, and how to run it live with your own key';
    anchor.addEventListener('click', () => M.toggle());
    paintBadge();
    anchor.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); M.toggle(); }
    });
  } else {
    badge = el('button', 'scrm-badge');
    badge.type = 'button';
    badge.addEventListener('click', () => M.toggle());
    paintBadge();
    document.body.append(badge);
  }

  document.addEventListener('keydown', ev => {
    const t = ev.target && ev.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (ev.key === '?') { ev.preventDefault(); M.toggle(); }
  });

  // A link can point straight at the explanation — the README does, so a judge lands on the
  // honest framing rather than having to find the badge.
  if (/(^|[?&])(demo|mode)(=|&|$)/.test(location.search)) M.open();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => M.boot());
} else { M.boot(); }
})(window.SCR = window.SCR || {});

</script>
</body>
</html>
