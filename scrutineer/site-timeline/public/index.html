<style>
/* The timeline page. Same pixel world as the broadcast, one job: the car over time. */
[hidden]{display:none !important}
:root{--night:#06081A;--studio:#121A4A;--ink:#000;--white:#FFF;--caption:#C8CBD8;--mid:#6A6F8A;
  --gold:#F4C542;--red:#E31E2D;--cyan:#3DD2FF;--green:#2FD968}
html,body{background:var(--night);margin:0;color:var(--white);
  font-family:"VT323","Courier New",monospace;-webkit-font-smoothing:none;overflow:hidden}
.tl{display:grid;grid-template-rows:46px minmax(0,1fr) 118px;height:100vh;max-height:100vh}
.px,.tl-mark,.tl-gen,.tl-side h2,.tl-play,.tl-score em,.tl-tag{font-family:"Press Start 2P","Courier New",monospace;text-transform:uppercase}

.tl-top{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:2px solid var(--studio)}
.tl-mark{font-size:15px;color:var(--white);border-bottom:3px solid var(--gold);padding-bottom:2px}
.tl-sub{font-size:19px;color:var(--mid);flex:1}
.tl-views{display:flex;gap:2px;margin-left:auto}
.tl-view{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;letter-spacing:.06em;
  background:var(--studio);color:var(--mid);border:0;padding:9px 13px;cursor:pointer}
.tl-view:hover{color:var(--white)}
.tl-view.on{background:var(--cyan);color:var(--ink)}
.tl-play{margin-left:10px;font-size:8px;background:var(--studio);color:var(--white);border:0;
  padding:9px 14px;cursor:pointer;letter-spacing:.06em}
.tl-play:hover{background:#1B245C}
.tl-play.on{background:var(--gold);color:var(--ink)}

.tl-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.tl-stage{position:relative;min-width:0;background:#000;border-right:2px solid var(--studio)}
.tl-stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:contain}
.tl-hud{position:absolute;left:16px;top:14px;display:flex;align-items:baseline;gap:10px}
.tl-gen{font-size:16px;color:var(--gold);background:var(--ink);padding:8px 10px}
.tl-of{font-size:19px;color:var(--mid)}
.tl-score{position:absolute;right:16px;top:14px;text-align:right;background:var(--ink);padding:8px 12px}
.tl-score em{display:block;font-style:normal;font-size:7px;color:var(--mid);letter-spacing:.1em}
.tl-score b{font-size:34px;line-height:30px;color:var(--white)}
.tl-score i{display:block;font-style:normal;font-size:17px;color:var(--green)}

.tl-side{padding:14px;overflow-y:auto;background:var(--night)}
.tl-side h2{font-size:8px;color:var(--gold);margin:0 0 9px;letter-spacing:.08em}
.tl-side h2:not(:first-child){margin-top:20px}
.tl-what{min-height:96px}
.tl-none{margin:0;font-size:18px;line-height:20px;color:var(--mid)}
.tl-kept{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-tag{font-size:7px;padding:5px 7px;letter-spacing:.08em}
.tl-tag.keep{background:var(--green);color:var(--ink)}
.tl-tag.drop{background:var(--red);color:var(--white)}
.tl-kept b{font-size:19px;color:var(--white)}
.tl-kept code{font-family:"Courier New",monospace;font-size:13px;color:var(--gold)}
.tl-sum{margin:7px 0 0;font-size:18px;line-height:20px;color:var(--caption)}
.tl-parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tl-part{font-family:"Courier New",monospace;font-size:11px;background:var(--studio);
  padding:5px 7px;color:var(--mid);border-left:3px solid var(--cyan)}
.tl-part i{font-style:normal;color:var(--mid)}
.tl-part b{color:var(--cyan)}

.tl-rig{display:flex;flex-direction:column;gap:3px}
.tl-comp{display:grid;grid-template-columns:1fr auto 26px;align-items:baseline;gap:8px;
  padding:5px 8px;background:var(--studio);opacity:.55;transition:opacity .3s ease,background .3s ease}
.tl-comp.up{opacity:1}
.tl-comp.now{background:#2A357F;box-shadow:inset 3px 0 0 var(--gold)}
.tl-cn{font-size:17px;color:var(--white)}
.tl-cp{font-family:"Courier New",monospace;font-size:10px;color:var(--mid)}
.tl-comp b{font-family:"Courier New",monospace;font-size:12px;color:var(--gold);text-align:right}

.tl-foot{border-top:2px solid var(--studio);padding:22px 40px 0}
.tl-rail{position:relative;height:44px;cursor:ew-resize;touch-action:none}
.tl-line{position:absolute;left:0;right:0;top:11px;height:3px;background:var(--studio)}
.tl-fill{position:absolute;left:0;top:11px;height:3px;background:var(--gold);
  transition:width .28s cubic-bezier(.3,.8,.3,1)}
.tl-tick{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.tl-tick i{display:block;width:9px;height:9px;background:var(--studio);
  outline:2px solid var(--night);margin-top:8px;transition:all .2s ease}
.tl-tick.keep i{background:var(--gold)}
.tl-tick.past i{background:var(--mid)}
.tl-tick.past.keep i{background:var(--gold)}
.tl-tick.on i{width:15px;height:15px;margin-top:5px;background:var(--white);outline-color:var(--gold)}
.tl-tn{font-family:"Courier New",monospace;font-size:10px;color:var(--mid)}
.tl-tick.on .tl-tn{color:var(--white)}
.tl-help{margin:4px 0 0;text-align:center;font-size:16px;color:var(--mid)}
@media (max-width:900px){.tl-body{grid-template-columns:minmax(0,1fr)}.tl-side{display:none}}

.tl-era{font-family:"Courier New",monospace;font-size:11px;color:var(--cyan);
  background:var(--ink);padding:5px 8px;letter-spacing:.08em}
.tl-note{display:block;font-size:14px;color:#4A4F68;margin-top:2px}

</style>
</head>
<body>
<!-- The car, across the whole season, under your thumb. Stubbed: it reads the recorded run. -->
<div class="tl">
  <header class="tl-top">
    <span class="tl-mark">SCRUTINEER</span>
    <span class="tl-sub">the car is the harness — drag to watch the loop rebuild it</span>
    <span class="tl-views">
      <button class="tl-view on" id="tlViewCar">CAR</button>
      <button class="tl-view" id="tlViewGarage">GARAGE</button>
    </span>
    <button class="tl-play" id="tlPlay">▶ PLAY</button>
  </header>

  <main class="tl-body">
    <section class="tl-stage">
      <canvas id="stage" aria-label="the car at this generation"></canvas>
      <div class="tl-hud">
        <span class="tl-gen" id="tlGen">START</span>
        <span class="tl-of" id="tlOf"></span>
        <span class="tl-era" id="tlEra"></span>
      </div>
      <div class="tl-score">
        <em>SCORE</em><b id="tlScore">—</b><i id="tlGain"></i>
      </div>
    </section>

    <aside class="tl-side">
      <h2>WHAT THIS RUN DID</h2>
      <div class="tl-what" id="tlWhat"></div>
      <h2>THE TEN COMPONENTS</h2>
      <div class="tl-rig" id="tlRig"></div>
    </aside>
  </main>

  <footer class="tl-foot">
    <div class="tl-rail" id="tlRail"></div>
    <p class="tl-help">drag · scroll · ← → · gold marks are the runs whose change survived the gates
      <span class="tl-note" id="tlNote"></span></p>
  </footer>
</div>

// ============================================================================
// SCR.timeline — the car, across the whole season, under your thumb.
//
// One scrubber. Drag it and the harness rebuilds at that generation: the parts
// the loop had earned by then, the score it was running, and what the change
// that generation actually altered on the car. Stubbed by design — it reads the
// recorded season, so it is the same ten runs every time and nothing waits on a
// model.
// ============================================================================
(function (SCR) {
'use strict';

const $ = id => document.getElementById(id);

  if (txt !== undefined) n.textContent = txt; return n; };

  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  ['AERO', 'RETRIEVAL', 'front wing, rear wing, fin', 'AERO'],
  ['DATA', 'VERIFICATION', 'floor', 'DATA'],
  ['TYRES', 'SAMPLING', 'compound', 'TYRES'],
  ['POWER_UNIT', 'MODEL', 'engine', 'POWER'],
  ['STRATEGIST', 'BUDGET', 'gearbox', 'STRATEGY'],
  ['SIMULATOR', 'CURRICULUM', 'DRS', 'SIM'],
  ['PIT_CREW', 'DEPLOY', 'brakes', 'TOOLS'],
  ['ENGINEER', 'PROPOSER', 'pit wall', 'ENGINEER'],

// eras begin at team level 26, 49, 73. A ten-run season moves the team from 10 to 15 and puts no
// role above 3, so left alone the garage never leaves the lock-up and every bench stays tier 0.
// This stretches the season's real span across the garage's visual range — the same kind of

      const h = el('div', 'tl-kept');
      h.innerHTML = `<span class="tl-tag keep">KEPT</span><b>${esc(NAME[r.role] || r.role)}</b>`

// ---------------------------------------------------------------------------------------
function buildScrubber() {

  const move = ev => { if (st.dragging) fromPointer(ev); };

  window.addEventListener('touchmove', move, { passive: true });

    if (ev.key === 'ArrowLeft') go(st.i - 1);

          : '';
